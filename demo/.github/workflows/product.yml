name: product
on: [pull_request]
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes @prodshape/cli@0.22.1 validate
      - run: npx --yes @prodshape/cli@0.22.1 citations verify
      - run: node --test tests/refund-window.test.mjs
